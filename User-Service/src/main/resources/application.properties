spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${PORT}

spring.application.name=user-service

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

spring.jpa.database-platform=${DB_DIALECT}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO}
spring.jpa.show-sql=${DB_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${DB_FORMAT_SQL}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED}
spring.h2.console.path=${H2_CONSOLE_PATH}

spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME}

security.jwt.access-secret=${JWT_ACCESS_SECRET}
security.jwt.refresh-secret=${JWT_REFRESH_SECRET}
security.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS}
security.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS}
security.jwt.enforce-device-match=${JWT_ENFORCE_DEVICE_MATCH}

otp.hmac.secret=${OTP_HMAC_SECRET}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.timeout=${REDIS_TIMEOUT}

logging.pattern.console=${LOGGING_PATTERN}
logging.level.root=${LOGGING_LEVEL_ROOT}
logging.level.com.irctc.userservice=${LOGGING_LEVEL_APP}
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY}

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_DETAILS}
